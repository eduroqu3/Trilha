{% extends "base.html" %}
{% block title %}{{ titulo }} — trilha{% endblock %}
{% block content %}
<a class="skip-link" href="#conteudo">Ir para o conteúdo</a>
<main id="conteudo" class="auth-page dashboard-page">
  <div class="site-container dashboard-layout">
    <section class="auth-card dashboard-card">
      <p class="eyebrow"><span></span>SEU CAMINHO NA TRILHA</p>
      <h1>{{ titulo }}</h1>
      <p class="auth-lede">Olá, {{ user.nome }}. Este espaço está sendo preparado para acolher sua experiência.</p>
      <form method="post" action="{% url 'sair' %}">
        {% csrf_token %}
        <button class="button button-primary" type="submit">Sair <span aria-hidden="true">↗</span></button>
      </form>
      <p class="auth-switch"><a href="{% url 'trocar_senha' %}">Trocar minha senha</a></p>
    </section>
  </div>
</main>
{% endblock %}
