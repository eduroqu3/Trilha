{% load static %}
<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#FAF6EE">
  <meta name="description" content="{% block description %}Um espaço para estudantes compartilharem como aprendem — e para escolas transformarem essas percepções em conversas e melhorias pedagógicas.{% endblock %}">
  <link rel="icon" type="image/svg+xml" href="{% static 'img/favicon.svg' %}?v=3">
  <title>{% block title %}Trilha — Escuta que vira caminho{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght,SOFT,WONK@0,9..144,400,0,1;0,9..144,500,0,1;1,9..144,400,0,1&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{% static 'css/app.css' %}?v=4.3.5">
  <script src="{% static 'js/messages.js' %}" defer></script>
  {% block extra_head %}{% endblock %}
</head>
<body>
  {% if messages %}<div class="site-messages" role="status">{% for message in messages %}<p>{{ message }}</p>{% endfor %}</div>{% endif %}
  {% block content %}{% endblock %}
</body>
</html>
