name: CI

on:
  push:
    branches: [main, passo6]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: trilha_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d trilha_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/trilha_test
      SECRET_KEY: ci-only-not-used-in-production
      DEBUG: "True"
      ALLOWED_HOSTS: localhost,127.0.0.1
      CSRF_TRUSTED_ORIGINS: http://localhost:8000,http://127.0.0.1:8000

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt

      - name: Ruff
        run: python -m ruff check .

      - name: Pytest on PostgreSQL
        run: python -m pytest

      - name: Download Tailwind CLI
        run: |
          curl --fail --location --silent --show-error \
            https://github.com/tailwindlabs/tailwindcss/releases/download/v4.3.5/tailwindcss-linux-x64 \
            --output /tmp/tailwindcss
          chmod +x /tmp/tailwindcss

      - name: Verify compiled CSS is current
        run: |
          /tmp/tailwindcss -i static/src/input.css -o /tmp/app.css --minify
          cmp --silent /tmp/app.css static/css/app.css || {
            echo "static/css/app.css is out of date; rebuild it with Tailwind v4.3.5."
            diff -u static/css/app.css /tmp/app.css || true
            exit 1
          }
